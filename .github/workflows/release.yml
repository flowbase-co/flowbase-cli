name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          command: manifest
          default-branch: main

  publish:
    if: github.event_name == 'release' || needs.release.outputs.release_created
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
        env:
          FLOWBASE_API_URL: ${{ vars.FLOWBASE_API_URL }}
          FLOWBASE_OAUTH_URL: ${{ vars.FLOWBASE_OAUTH_URL }}
          FLOWBASE_APP_ID: ${{ vars.FLOWBASE_APP_ID }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
